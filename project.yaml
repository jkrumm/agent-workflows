# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: agent-workflows
deploy:
  mode: make # `make deploy` releases origin/master on the mini; `make verify` proves it, `make version` reads the live sha
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
  migrations: []
ship:
  - { paths: ['**'], via: push }
leads: 1
