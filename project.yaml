# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: agent-workflows
deploy:
  mode: make # `make deploy` releases origin/master on the mini; `make verify` proves it, `make version` reads the live sha
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
ship:
  - { via: pr } # CI runs the full gate (make check) on the pull request head before the merge; leads run check-fast
# A lead runs `make check-fast` (static, and the tests the branch touches); CI runs `make check` on the pull request head and the merge waits for
# it, so the full suite runs once per Issue instead of once per change (packages/testing/src/fast-tier.ts decides what the fast tier runs).
checks: { fast: make check-fast, full: make check, ci: true }
# The static checks and the test suite may run on the factory's step host when the mini's test line would make them wait (Makefile
# `static` and `test`, `$(call slot,<step>)`; `factory slot run` places them). Neither needs a secret or a mini service on the host:
# `test` starts a private Postgres cluster from the image's server binaries (scripts/test-env.sh) where the mini uses its maintained
# one through secrets-run. `test` names its own image because the suite also runs zsh scripts and the real ffmpeg
# (tools/step-image/Dockerfile; CI installs both, and a step has CI set, so a missing one fails). The install and the mini-registry lint stay in
# `make check` on the mini, and so does `usage` (the two suites that apply the usage-tracker checkout's migrations: a sibling repository
# only the mini has), which takes no slot.
steps:
  static: { make: static, remote: true }
  test: { make: test, remote: true, dockerfile: tools/step-image/Dockerfile }
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
