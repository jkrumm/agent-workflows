# This repo's entries in the mini's service registry (dotfiles docs/mini-registry.md). process_type: interactive says the
# job's plist carries ProcessType Interactive (scheduling priority 31, not launchd's throttled default of 20); make mini-ps
# and the heartbeat's check_registry fail when it runs lower.
services:
  - {
      name: agent-workflows-gateway,
      kind: launchd,
      tier: core,
      label: com.jkrumm.agent-workflows-gateway,
      process_type: interactive,
      memory_mib: 70,
    }
  - {
      name: agent-workflows-audio,
      kind: launchd,
      tier: core,
      label: com.jkrumm.agent-workflows-audio,
      door: audio,
      process_type: interactive,
      memory_mib: 110,
    }
  - {
      name: agent-workflows-host,
      kind: launchd,
      tier: core,
      label: com.jkrumm.agent-workflows-host,
      door: agw-image,
      process_type: interactive,
      memory_mib: 290,
    }
  - {
      name: research-chrome,
      kind: launchd,
      tier: on-demand,
      label: com.jkrumm.research-chrome,
      memory_mib: 1024,
      exception:
        {
          keepalive-poll: 'the loop supervises a GUI Chrome, not a schedule: Chrome hands a second launch on the same profile to the running instance and exits 0, so a plain KeepAlive agent would respawn and open a tab every ThrottleInterval while another Chrome holds 9222',
        },
    }
  - {
      name: agent-workflows-eval-mine,
      kind: launchd,
      tier: core,
      label: com.jkrumm.agent-workflows-eval-mine,
      memory_mib: 50,
      note: '04:30 nightly review-ground-truth labelling (agw eval mine review --auto); installed by make eval-mine-job, removes itself at the bug-case target',
    }
